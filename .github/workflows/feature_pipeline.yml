name: Lahore Hourly Feature Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"  # every hour, UTC

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      HISTORY_MONTHS: "6"
      RECENT_OVERLAP_DAYS: "7"
      FORECAST_HOURS: "72"
      RAW_FEATURE_GROUP_NAME: lahore_aqi_raw_6m
      RAW_FEATURE_GROUP_VERSION: "1"
      FEATURE_GROUP_NAME: lahore_aqi_engineered_6m
      FEATURE_GROUP_VERSION: "1"
      FEATURE_VIEW_NAME: lahore_aqi_training_view_6m
      FEATURE_VIEW_VERSION: "1"
      MODEL_NAME: lahore_aqi_forecaster_6m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run feature pipeline (retries on transient Hopsworks/network errors)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            if python -m src.feature_pipeline; then
              echo "Succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          echo "All 3 attempts failed."
          exit 1
